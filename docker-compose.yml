services:
    postgres:
        image: postgres:17-alpine
        container_name: expence-tracker-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-expence_tracker}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expence_tracker}']
            interval: 5s
            timeout: 5s
            retries: 10
    dbhub:
        image: bytebase/dbhub:latest
        ports:
            - '8080:8080'
        command:
            - '--transport=http'
            - '--port=8080'
            - '--dsn=postgresql://postgres:postgres@postgres:5432/expence_tracker?sslmode=disable'
        depends_on:
            - postgres
volumes:
    pgdata:
